# Checks run before each commit (`uvx pre-commit install`) and in CI (.github/workflows/checks.yml).
# The recipes are validated by the tests (tests/python/test_recipes.py), with the pinned arco-make.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  # ruff and ty of the project's environment (uv.lock), as CI runs them (ci.yml).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types: [python]
      - id: ty-check
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false
      # The marimo notebooks: names defined once, cells that form a graph, Markdown as marimo
      # writes it.
      - id: marimo-check
        name: marimo check
        entry: uvx marimo@0.25.2 check
        language: system
        files: ^notebooks/.*\.py$
      - id: site-tests
        name: web page tests (node --test)
        entry: uvx --from nodejs-wheel==24.19.0 node --test 'tests/js/*.test.js'
        language: system
        files: ^(docs/assets/js|tests/js)/
        pass_filenames: false
      # The scripts' tests (tests/bats; the libraries are submodules: git submodule update
      # --init). The heartbeat's need the project's environment (uv sync), else they are skipped.
      - id: bats
        name: scripts' tests (bats)
        entry: tests/bats/helpers/bats-core/bin/bats tests/bats
        language: system
        # The heartbeat's tests run the package: src/arco_ocean too.
        files: ^(scripts|systemd|src/arco_ocean|tests/bats)/
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse-lint-file

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
