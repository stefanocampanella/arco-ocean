[project]
name = "arco-ocean"
version = "2.0.0"
description = "ARCO-OCEAN's tools: the forecast collection's heartbeat, the recipes' checks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    # The release whose image the scripts run (tests/python/test_image.py). It brings xarray,
    # icechunk and botocore, which read the forecast repositories and publish the heartbeat.
    "arcomake @ git+https://github.com/stefanocampanella/arco-make.git@v0.2.0",
    "click",
    "pydantic>=2.11",
]

[project.scripts]
arco-ocean = "arco_ocean.cli:cli"

[dependency-groups]
# Tests, lint and types: `uv sync` installs them (the default group).
dev = [
    # The coarsening notes run as a test (tests/python/test_notebooks.py); the version of the
    # notebooks.
    "marimo==0.25.2",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
# The notebooks (notebooks/): `uv run --group notebooks marimo edit notebooks/oni.py`, or in their
# own environment from their inline metadata (`uvx marimo edit --sandbox notebooks/oni.py`).
notebooks = [
    "xarray>=2025.1.1",
    "numpy",
    "cftime",
    "zarr",
    "obstore",
    "dask",
    "distributed",
    "marimo",
    "pip",
    "matplotlib",
    "cartopy",
    "nc-time-axis",
    "arraylake>=0.33.0",
    "netcdf4>=1.7.4",
    "pooch>=1.9.0",
    "ipython>=9.6.0",
    "icechunk>=2",
    "virtualizarr>=2.5.1",
    "arro3-core>=0.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build >= 0.11.7"]
build-backend = "uv_build"

# The style of arco-make: 2-space indentation, 100 columns, the same rules.
[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 2
# The bats libraries (git submodules) are theirs.
extend-exclude = ["tests/bats/helpers"]

[tool.ruff.format]
# marimo writes its notebooks in its own form (4-space indentation) whenever they are saved.
exclude = ["notebooks/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B028"]

[tool.ruff.lint.isort]
known-first-party = ["arco_ocean"]

[tool.ruff.lint.per-file-ignores]
# marimo notebooks: a cell shows its last expression (B018). The ONI tutorial: ruff reads the
# strings of its `Literal[...]` as names (F821; `marimo check` checks the cells' names), and its
# code is kept as adapted (F841); in the others, an undefined name is an error.
"notebooks/*.py" = ["B018"]
"notebooks/oni.py" = ["B018", "F821", "F841"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/arco_ocean/**/*.py"]

[tool.ty.rules]
# Every rule is an error, as in arco-make: the type checker gates commits (pre-commit) and CI.
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
# Tests marked `live` read the real sources: skipped unless pytest gets `--live`
# (tests/python/conftest.py).
addopts = ["-ra", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
source = ["arco_ocean"]
