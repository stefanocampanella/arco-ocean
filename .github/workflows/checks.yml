# The pre-commit checks (.pre-commit-config.yaml): TOML and YAML syntax, marimo, the web page's
# tests, ShellCheck, REUSE, secrets. ruff and ty run in ci.yml's lint job, with the project's
# environment: skipped here, which needs none.
name: checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks scans the history
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,ty-check
