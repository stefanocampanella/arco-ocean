version = 1

# Files that cannot carry an SPDX header (documentation, data, images, test fixtures, lock and
# citation files).
# Recipes, scripts, tests, workflows and notebooks carry their own.
[[annotations]]
path = [
  "**.md",
  "**.cff",
  "**.lock",
  "**.png",
  "pyproject.toml",
  ".gitignore",
  ".gitmodules",
  "tests/js/fixtures/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Stefano Campanella"
SPDX-License-Identifier = "MIT"

# The animation and its icon (notebooks/animation.py) show the dataset's values: CC BY 4.0, as the
# data, crediting the Copernicus Marine Service where they are shown.
[[annotations]]
path = ["docs/assets/images/arco-ocean.png", "docs/assets/images/arco-ocean.webp"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Stefano Campanella"
SPDX-License-Identifier = "CC-BY-4.0"

# The citations of the DOIs the site cites, from doi.org (Crossref and DataCite metadata, CC0), so
# that the site builds without asking doi.org (docs/references.bib).
[[annotations]]
path = ["docs/references.bib"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
